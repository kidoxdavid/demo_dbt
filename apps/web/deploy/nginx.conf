# Serves the built web app and forwards API and media requests to the API container. TLS is expected to terminate in front of this (load balancer / ingress).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 6m;                                   # images are capped at 5 MB by the API

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location /api/   { proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /media/ { proxy_pass http://api:3000; proxy_set_header Host $host; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }               # single-page app: client-side routes fall back to index.html
}
