# Production-like stack: Postgres, API, web. UNTESTED in the build sandbox (no Docker daemon). Copy .env.example to .env and fill every value first.
# TLS must terminate in front of the web container. Never commit .env.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set in .env}
      EAZY_OWNER_PASSWORD: ${EAZY_OWNER_PASSWORD:?set in .env}
      EAZY_APP_PASSWORD: ${EAZY_APP_PASSWORD:?set in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
      DATABASE_URL: postgres://eazy_app:${EAZY_APP_PASSWORD}@db:5432/eazystores
      MIGRATION_DATABASE_URL: postgres://eazy_owner:${EAZY_OWNER_PASSWORD}@db:5432/eazystores
      PUBLIC_URL: ${PUBLIC_URL:?set in .env}
      ALLOWED_ORIGINS: ${PUBLIC_URL}
      MFA_ENC_KEY: ${MFA_ENC_KEY:?set in .env (openssl rand -hex 32)}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-EazyStores <no-reply@example.com>}
    volumes: [ "uploads:/data/uploads" ]
    # Run migrations with the owner role, then start. The running API only ever uses the restricted app role.
    command: ["sh", "-c", "node dist/migrate.js && node dist/server.js"]
  web:
    build: ./apps/web
    restart: unless-stopped
    depends_on: [ api ]
    ports: [ "8080:80" ]
volumes: { dbdata: {}, uploads: {} }
